<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#eaf2fb"/>

  <!-- Kepala (dikecilin, biar proporsional sama paruh yang panjang) -->
  <ellipse cx="8.5" cy="13" rx="5" ry="4.6" fill="#2b579a"/>

  <!-- Mata -->
  <circle cx="9.8" cy="11.2" r="0.9" fill="#eaf2fb"/>

  <!-- Paruh + kantong (pouch) jadi SATU bentuk memanjang — paruh atas nyaris lurus ke
       ujung runcing, kantong bawah ikut memanjang sepanjang paruh (bukan cuma bulge
       kecil deket kepala), baru menyempit ketemu ujung. Ini yang bikin kerasa proporsional
       kayak pelikan asli. -->
  <path
    d="M12 11.5
       Q 22 8.5 30 9.5
       Q 25 12.5 22.5 14
       Q 24.5 18.5 20.5 21.5
       Q 15.5 23.5 13 18.5
       Q 11 15 12 11.5 Z"
    fill="#2b579a"
  />
</svg>